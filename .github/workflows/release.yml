name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for a published release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/v\1/p' Cargo.toml)
          test -n "$version"
          published=$(gh api --paginate --slurp 'repos/{owner}/{repo}/releases?per_page=100' |
            jq --arg version "$version" 'any(.[][]; .tag_name == $version and .draft == false)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    if: needs.check-version.outputs.published == 'false'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: yomitore-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: yomitore-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install stable --profile minimal --target "$TARGET"

      - name: Build and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          cargo +stable build --release --locked --target "$TARGET"
          tar -czf "$ASSET.tar.gz" -C "target/$TARGET/release" yomitore

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.check-version.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          pattern: yomitore-*
          path: dist
          merge-multiple: true

      - name: Attach both assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          state=$(gh api --paginate --slurp 'repos/{owner}/{repo}/releases?per_page=100' |
            jq -r --arg version "$VERSION" '
              [.[][] | select(.tag_name == $version)] |
              if any(.[]; .draft == false) then "published"
              elif length > 0 then "draft"
              else "missing" end')
          if [[ "$state" == published ]]; then
            exit 0
          fi

          linux=dist/yomitore-linux-x86_64.tar.gz
          macos=dist/yomitore-macos-aarch64.tar.gz
          test -s "$linux"
          test -s "$macos"

          tag_refs=$(git ls-remote origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}")
          tag_commit=$(awk 'END {print $1}' <<< "$tag_refs")
          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $VERSION points to a different commit." >&2
            exit 1
          fi

          if [[ "$state" == missing ]]; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "Release $VERSION" --notes "" --draft
          fi
          gh release upload "$VERSION" "$linux" "$macos" --clobber
          gh release edit "$VERSION" --target "$GITHUB_SHA" --draft=false
