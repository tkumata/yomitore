[package]
name = "yomitore"
version = "0.1.24"
edition = "2024"
rust-version = "1.100"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls",
    "http2",
    "system-proxy",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
dirs = "7.0.0"
toml = "1.2.3"
ratatui = { version = "0.30.2", features = [
    "crossterm",
    "unstable-rendered-line-info",
] }
crossterm = "0.29"
ratatui-textarea = "0.9.4"
jiff = { version = "1.0.3", features = ["serde"] }
rand = "0.10.4"

[lints.cargo]
unused_dependencies = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
